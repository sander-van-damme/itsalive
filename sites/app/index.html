<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>itsalive</title>
    <!-- Tailwind's browser runtime intentionally observes live markup so LLM-added
         utility classes work after load; this is not a development-only build shortcut. -->
    <script data-app-runtime src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script data-app-runtime src="https://unpkg.com/lucide@latest"></script>
    <style data-app-runtime>
      :is(#itsalive-root[data-itsalive-building], #itsalive-root [data-itsalive-building]) {
        position: relative;
        isolation: isolate;
      }
      :is(#itsalive-root[data-itsalive-building], #itsalive-root [data-itsalive-building])::after {
        content: "Building…";
        position: absolute;
        inset: 0;
        z-index: 2147483646;
        display: grid;
        place-items: center;
        min-height: 80px;
        background: color-mix(in srgb, Canvas 58%, transparent);
        color: CanvasText;
        backdrop-filter: blur(4px) saturate(.8);
        -webkit-backdrop-filter: blur(4px) saturate(.8);
        font: 600 13px/1.2 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: .01em;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: no-preference) {
        :is(#itsalive-root[data-itsalive-building], #itsalive-root [data-itsalive-building])::after {
          animation: itsalive-building-pulse 1.4s ease-in-out infinite alternate;
        }
      }
      @keyframes itsalive-building-pulse { to { opacity: .72; } }
    </style>
  </head>
  <body>
    <main id="itsalive-root" style="min-height:100dvh;display:grid;place-items:center;font-family:ui-sans-serif,system-ui;background:#f7f8f5;color:#18201b">
      <section style="max-width:520px;padding:40px;text-align:center">
        <div style="font-size:36px">✦</div>
        <h1 style="font-size:28px;margin:12px 0 8px">Preparing your app</h1>
        <p style="color:#687169;line-height:1.6">Your first version will appear here as it builds. You can keep refining it from Chat.</p>
      </section>
    </main>
    <script data-app-runtime type="module" src="./main.ts"></script>
  </body>
</html>
