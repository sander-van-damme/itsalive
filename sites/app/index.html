<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>itsalive</title>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Platform-provided library styles. -->
    <link data-app-runtime rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/14.0.5/swiper-bundle.min.css" />
    <link data-app-runtime rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link data-app-runtime rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.4/katex.min.css" />

    <!-- Tailwind's browser runtime intentionally observes live markup so LLM-added
         utility classes work after load; this is not a development-only build shortcut. -->
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss-browser/4.3.3/index.global.min.js"></script>

    <!-- Platform-provided libraries. Versions are pinned so persisted apps remain reproducible. -->
    <script data-app-runtime src="https://cdn.jsdelivr.net/npm/lucide@1.46.0/dist/umd/lucide.min.js"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.21/dayjs.min.js"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/14.0.5/swiper-bundle.min.js"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.15.0/mermaid.min.js"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/15.1.0/math.min.js"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.4/katex.min.js"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.5.4/papaparse.min.js"></script>
    <script data-app-runtime src="https://cdn.jsdelivr.net/npm/fuse.js@7.5.0"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/3.1.2/chroma.min.js"></script>

    <style data-app-runtime>
      [x-cloak] { display: none !important; }
      :is(#itsalive-root[data-itsalive-building], #itsalive-root [data-itsalive-building]) {
        position: relative;
        isolation: isolate;
      }
      :is(#itsalive-root[data-itsalive-building], #itsalive-root [data-itsalive-building])::after {
        content: "Building…";
        position: absolute;
        inset: 0;
        z-index: 2147483646;
        display: grid;
        place-items: center;
        min-height: 80px;
        background: color-mix(in srgb, Canvas 58%, transparent);
        color: CanvasText;
        backdrop-filter: blur(4px) saturate(.8);
        -webkit-backdrop-filter: blur(4px) saturate(.8);
        font: 600 13px/1.2 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: .01em;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: no-preference) {
        :is(#itsalive-root[data-itsalive-building], #itsalive-root [data-itsalive-building])::after {
          animation: itsalive-building-pulse 1.4s ease-in-out infinite alternate;
        }
      }
      @keyframes itsalive-building-pulse { to { opacity: .72; } }
    </style>
  </head>
  <body>
    <main id="itsalive-root" style="min-height:100dvh;display:grid;place-items:center;font-family:ui-sans-serif,system-ui;background:#f7f8f5;color:#18201b">
      <section style="max-width:520px;padding:40px;text-align:center">
        <div style="font-size:36px">✦</div>
        <h1 style="font-size:28px;margin:12px 0 8px">Preparing your app</h1>
        <p style="color:#687169;line-height:1.6">Your first version will appear here as it builds. You can keep refining it from Chat.</p>
      </section>
    </main>

    <!-- Alpine plugins must load before Alpine core. -->
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs-persist/3.15.0/cdn.min.js"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs-collapse/3.15.0/cdn.min.js"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs-focus/3.15.0/cdn.min.js"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs-sort/3.15.0/cdn.min.js"></script>
    <script data-app-runtime src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.15.0/cdn.min.js"></script>

    <!-- Three.js no longer ships a global/UMD build; expose the pinned ESM namespace for agent code. -->
    <script data-app-runtime type="module">
      import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.186.0/three.module.min.js";
      window.THREE = THREE;
    </script>

    <script data-app-runtime type="module" src="./main.ts"></script>
  </body>
</html>
